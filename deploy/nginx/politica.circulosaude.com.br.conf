# Server block for politica.circulosaude.com.br
# Serves the static privacy-policy page (single self-contained index.html).
#
# Deploy:
#   1. sudo cp politica.circulosaude.com.br.conf /etc/nginx/sites-available/
#   2. sudo ln -s /etc/nginx/sites-available/politica.circulosaude.com.br.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d politica.circulosaude.com.br
#      (certbot rewrites this file to add the 443 server block + SSL directives
#      and sets up auto-renewal; the "location /.well-known/acme-challenge/"
#      block below is what lets that first certbot run succeed over plain HTTP)

server {
    listen 80;
    listen [::]:80;
    server_name politica.circulosaude.com.br;

    root /var/www/politica.circulosaude.com.br;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/politica.circulosaude.com.br;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/politica.circulosaude.com.br.access.log;
    error_log  /var/log/nginx/politica.circulosaude.com.br.error.log;
}
