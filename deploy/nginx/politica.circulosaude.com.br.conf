# Server block for politica.circulosaude.com.br
# Serves the static privacy-policy page (single self-contained index.html).
#
# The VM only has a private IP right now, so Let's Encrypt's HTTP-01
# challenge can't reach it to issue a real certificate. Until this goes
# public (or an internal CA cert is available), port 443 uses a
# self-signed cert just so this vhost's own content is served instead
# of falling through to another app's default_server on 443. Browsers
# will show an untrusted-certificate warning — expected for now.
#
# Generate the self-signed cert (once):
#   sudo mkdir -p /etc/nginx/ssl/politica.circulosaude.com.br
#   sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#     -keyout /etc/nginx/ssl/politica.circulosaude.com.br/privkey.pem \
#     -out /etc/nginx/ssl/politica.circulosaude.com.br/fullchain.pem \
#     -subj "/CN=politica.circulosaude.com.br"
#
# Deploy:
#   1. sudo cp politica.circulosaude.com.br.conf /etc/nginx/sites-available/
#   2. sudo ln -s /etc/nginx/sites-available/politica.circulosaude.com.br.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# To swap in a real certificate later (public IP, or an internal CA):
# replace the ssl_certificate/ssl_certificate_key paths below — or, once
# the VM has a public IP, run `sudo certbot --nginx -d politica.circulosaude.com.br`
# and it will rewrite this file's 443 block for you.

server {
    listen 80;
    listen [::]:80;
    server_name politica.circulosaude.com.br;

    root /var/www/politica.circulosaude.com.br;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/politica.circulosaude.com.br;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/politica.circulosaude.com.br.access.log;
    error_log  /var/log/nginx/politica.circulosaude.com.br.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name politica.circulosaude.com.br;

    ssl_certificate     /etc/nginx/ssl/politica.circulosaude.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/politica.circulosaude.com.br/privkey.pem;

    root /var/www/politica.circulosaude.com.br;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/politica.circulosaude.com.br.access.log;
    error_log  /var/log/nginx/politica.circulosaude.com.br.error.log;
}
